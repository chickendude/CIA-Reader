name: ciareader-prod

# Production stack. Boots on a single Hetzner CX/CCX box. Caddy is the
# only service that binds host ports (80/443); everything else lives on
# the internal network. Pair with infra/.env for secrets and
# infra/Caddyfile for the reverse-proxy config.
#
# Operate:
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d --build
#   docker compose -f infra/docker-compose.prod.yml down

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ciareader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ciareader}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ciareader} -d ${POSTGRES_DB:-ciareader}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    # AOF off, RDB snapshot every 60s if ≥1 key changed. Loglevel
    # warning to keep the journal small (BullMQ is chatty at notice).
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    volumes:
      - redis-data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  nlp:
    build:
      context: ..
      dockerfile: services/nlp/Dockerfile
    restart: always
    # Single uvicorn worker with all of the container's CPU budget.
    # We previously ran two workers on 1.5 cpus, but that meant two
    # full Stanza model loads in RAM and two PyTorch BLAS pools
    # contending for the cgroup CPU quota — Hindi chapters took
    # 10–30+ minutes wall-clock, hit the undici headers timeout, and
    # surfaced as `UND_ERR_HEADERS_TIMEOUT` failures in the texts
    # table. One worker × N threads is faster end-to-end and uses
    # roughly half the RAM. Stanza loads each language's pipeline
    # lazily on first request, so a single process per container
    # still serves all three.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    networks:
      - internal
    environment:
      PYTHONPATH: /opt/shared-types:/srv/nlp
      # Pin PyTorch / NumPy / Stanza's BLAS thread count to the
      # cgroup CPU quota. Without these, the libraries try to use
      # every host core they can see, then Docker throttles them —
      # which on Hindi depparse can mean 5–10× slower than just
      # matching the quota up front. Keep these in lockstep with
      # `deploy.resources.limits.cpus` below if you retune.
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      OPENBLAS_NUM_THREADS: "3"
    deploy:
      resources:
        limits:
          # 4-vCPU / 8-GB host: NLP takes 3 cpus, web keeps 1; the
          # host has ~1 cpu of headroom for postgres/redis/caddy
          # bursts. Bump in lockstep with the *_NUM_THREADS env vars
          # above if you move to a bigger box.
          memory: 3000m
          cpus: "3.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile.prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      # Service-network URLs — overrides anything in env_file so a
      # forgotten dev-style entry there can't accidentally leak.
      NLP_SERVICE_URL: http://nlp:8000
      DATABASE_URL: postgres://${POSTGRES_USER:-ciareader}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ciareader}
      REDIS_URL: redis://redis:6379
      AUDIO_LOCAL_ROOT: /srv/audio
      # adapter-node defaults to PORT=3000; we standardize on 5173
      # across dev + prod so EXPOSE / healthcheck / Caddy all line up.
      PORT: "5173"
      # adapter-node's `get_raw_body` defaults to a 512 KB cap, which
      # rejected EPUB uploads (up to MAX_EPUB_BYTES = 50 MB) and
      # audio uploads (up to MAX_AUDIO_BYTES = 80 MB) with a
      # confusing low-level 500 before the route's own validator
      # could surface a friendlier 413. 100 MB clears the largest
      # app-side limit plus multipart boundary overhead, leaving the
      # per-route MAX_*_BYTES checks as the source of truth.
      BODY_SIZE_LIMIT: "100000000"
      # Without an explicit `--max-old-space-size`, Node sizes V8's
      # old generation against a conservative cgroup-memory heuristic
      # (~50% of the limit) and `processTextNow` would OOM around
      # 720 MB even on the 1500m limit — the trace is a chain of
      # "Reached heap limit Allocation failed" / "Aborted (core
      # dumped)" lines, with `restart: always` looping the container.
      # 2600 MB leaves ~400 MB headroom under the 3000m container
      # limit below for native heap, libuv buffers, and any other
      # off-heap allocations.
      NODE_OPTIONS: "--max-old-space-size=2600"
    volumes:
      - audio-data:/srv/audio
    networks:
      - internal
    deploy:
      resources:
        limits:
          # Bumped from 1500m: EPUB processing pre-loads the language's
          # full lemma index + tokenizes every chapter in-process, and
          # 1500m wasn't enough headroom once the lemma table grew past
          # MVP size. NODE_OPTIONS above caps V8's heap so this limit
          # only has to cover heap + Node native + libuv overhead.
          memory: 3000m
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # Hits /healthz (lighter than /api/v1/smoke — no NLP round-trip,
      # just a 1ms DB ping). Container is "healthy" when web can reach
      # postgres and serve a request.
      test:
        - CMD-SHELL
        - "node -e \"require('http').get('http://localhost:5173/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
      interval: 30s
      timeout: 10s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
      - public
    depends_on:
      web:
        condition: service_healthy
    environment:
      # Substituted into Caddyfile at boot. APP_DOMAIN must match the
      # DNS A/AAAA record pointing at this box; ACME_EMAIL is the
      # contact for Let's Encrypt account / renewal warnings.
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set in infra/.env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in infra/.env}
      # ACME endpoint. Caddy errors on an empty `acme_ca` directive,
      # so we default to LE production here in compose rather than
      # inside the Caddyfile. Override to staging in infra/.env to
      # rate-limit-safely test a fresh deploy.
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      # Future-proofing: the API-subdomain block in the Caddyfile is
      # commented out by default, so this var can stay unset until the
      # frontend is updated to call api.<APP_DOMAIN> directly.
      API_DOMAIN: ${API_DOMAIN:-}
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    restart: always
    # Run tini as PID 1 so dcron (which runs as crond's child) can
    # successfully setpgid. Without this, busybox dcron exits at
    # startup with `setpgid: Operation not permitted` (kernel rule:
    # PID 1 cannot change its process group).
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ciareader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ciareader}
      RCLONE_REMOTE: ${RCLONE_REMOTE:?RCLONE_REMOTE must be set in infra/.env, e.g. dropbox:ciareader-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-}
    volumes:
      # Read-only mount of the audio volume so the weekly tar can
      # see uploads without touching them.
      - audio-data:/var/audio:ro
      # Persists the rclone OAuth token across container recreation.
      # First-time setup: see infra/backup/README.md.
      - rclone-config:/config/rclone
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Uptime Kuma (T-13.5) — self-hosted monitor that pings the public
  # health endpoints and notifies via email / Discord / Slack / etc.
  # Lives only on the internal network; Caddy proxies the admin UI
  # at status.<APP_DOMAIN>. Persisted state in `kuma-data` so monitor
  # configs + notification channels survive container recreation.
  kuma:
    image: louislam/uptime-kuma:1
    restart: always
    volumes:
      - kuma-data:/app/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Two networks so postgres / redis / nlp / web stay invisible to the
# public side. Only caddy bridges both.
networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  postgres-data: {}
  redis-data: {}
  caddy-data: {}    # ACME state — survives restarts so cert renewal is seamless.
  caddy-config: {}
  audio-data: {}    # Object storage backend lives here for the local-fs
                    # mode. Switching to Hetzner Object Storage (S3 API)
                    # is a follow-up — env hooks (AUDIO_S3_*) are already
                    # documented in .env.prod.example.
  rclone-config: {} # Backup service's rclone config (Dropbox/B2/etc OAuth
                    # token). Survives container recreation so re-auth
                    # isn't needed after every deploy.
  kuma-data: {}     # Uptime Kuma's monitor configs + notification channels.
