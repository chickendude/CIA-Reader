name: ciareader

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ciareader
      POSTGRES_PASSWORD: ciareader
      POSTGRES_DB: ciareader
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciareader -d ciareader"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025" # Web UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 5s
      timeout: 3s
      retries: 10

  nlp:
    build:
      context: ..
      dockerfile: services/nlp/Dockerfile
    volumes:
      - ../services/nlp/app:/srv/nlp/app
      - ../services/nlp/tests:/srv/nlp/tests
      - ../packages/shared-types/python:/opt/shared-types
      # Uncomment to mount a GCP service-account key for Vision OCR
      # (scanned-page path) and point GOOGLE_APPLICATION_CREDENTIALS at it:
      # - ./secrets:/secrets:ro
    ports:
      - "${NLP_HOST_PORT:-8000}:8000"
    environment:
      PYTHONPATH: /opt/shared-types:/srv/nlp
      # Google Cloud Vision creds for the PDF OCR scanned-page path. Empty
      # by default — the born-digital path needs no creds, so dev works
      # without GCP. To OCR scans, drop a service-account JSON under
      # infra/secrets/ and set GOOGLE_APPLICATION_CREDENTIALS to e.g.
      # /secrets/gcp-vision.json (matching the volume mount above).
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - ../apps/web/src:/srv/app/apps/web/src
      - ../apps/web/static:/srv/app/apps/web/static
      - ../apps/web/svelte.config.js:/srv/app/apps/web/svelte.config.js
      - ../apps/web/vite.config.ts:/srv/app/apps/web/vite.config.ts
      - ../apps/web/tsconfig.json:/srv/app/apps/web/tsconfig.json
      - ../apps/web/drizzle.config.ts:/srv/app/apps/web/drizzle.config.ts
      - ../apps/web/drizzle:/srv/app/apps/web/drizzle
      - ../packages/shared-types/src:/srv/app/packages/shared-types/src
    environment:
      NLP_SERVICE_URL: http://nlp:8000
      DATABASE_URL: postgres://ciareader:ciareader@postgres:5432/ciareader
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-only-secret-replace-in-prod-0000000000000000000000000000000
      APP_BASE_URL: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@ciareader.local
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    command:
      - sh
      - -c
      - |
        pnpm --filter @ciareader/web exec drizzle-kit migrate &&
        pnpm --filter @ciareader/web dev

volumes:
  postgres-data:
  redis-data:
