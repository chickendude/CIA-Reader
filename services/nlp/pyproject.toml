[project]
name = "ciareader-nlp"
version = "0.0.0"
description = "CIA Reader dictionary lookup, romanization, and PDF text extraction."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.0",
  # Convert saved spellings to a reading in Latin script.
  "indic-transliteration>=2.3.68",
  # Aksharamukha is used only for Hindi schwa-deletion preprocessing
  # (Devanagari → schwa-deleted Devanagari, virama-marked); the actual
  # romanization is then handled by indic-transliteration as for every
  # other language. We don't depend on aksharamukha's romanization
  # output schemes — only on its `RemoveSchwaHindi` source-side rule.
  "aksharamukha>=2.3",
  "arq>=0.26.0",
  # Multipart form parsing for the /ocr endpoint (page-image upload).
  # Pure-Python, tiny; FastAPI requires it for Form/File params and the
  # tests post multipart bodies, so it stays in base deps.
  "python-multipart>=0.0.9",
  # HindiDB reads the dictionary maintained by Parhiba, with no second writable store.
  "psycopg[binary]>=3.2",
  "regex>=2024.9.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  # arq worker jobs are async coroutines; tests exercise them directly
  # (asyncio_mode=auto in pytest config picks up bare async defs too).
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.2",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
]
# OCR for the PDF image reader. Vision is imported lazily in
# app.ocr.vision, so the default test/CI lane (which exercises the
# born-digital path + a fake Vision annotation) doesn't need it; the
# Docker image installs [ocr] for the real scanned-page path.
ocr = [
  "google-cloud-vision>=3.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "hindidb*", "parhiba_hindi*", "parhiba_dictionary*"]

[tool.setuptools.package-data]
hindidb = ["data/*.json", "UPSTREAM.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["hindidb"] # The original Hindi dictionary code keeps its own style.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to be called in
# argument defaults (Form/File/Depends). Whitelist them so B008 doesn't
# fire on the /ocr multipart handler.
extend-immutable-calls = ["fastapi.Form", "fastapi.File", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
