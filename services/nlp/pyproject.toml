[project]
name = "ciareader-nlp"
version = "0.0.0"
description = "CIA Reader NLP service (FastAPI + Stanza + IndicNLP)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.0",
  # Pure-Python, small dep — used both in tests and in production for
  # precomputing reader romanizations (T-2.5) and converting user input
  # from the script-aware editor (T-6.2a). Kept as a base dep rather
  # than under [models] so CI exercises it directly.
  "indic-transliteration>=2.3.68",
  # Python-native Redis job queue for async NLP work (T-2.6). The
  # worker process imports RedisSettings at module load; keep it in
  # base deps so tests that import app.worker don't need [models].
  "arq>=0.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  # arq worker jobs are async coroutines; tests exercise them directly
  # (asyncio_mode=auto in pytest config picks up bare async defs too).
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.2",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
]
# Heavyweight runtime-only ML deps. The Docker image for the NLP service
# installs `[dev,models]`; CI and local test runs only need `[dev]` because
# :mod:`app.pipelines.hindi` lazy-imports stanza and the tests inject a
# fake stanza object instead of loading the real model.
models = [
  "stanza>=1.8.0",
  # IndicNLP is the Marathi tokenizer fallback (T-2.3) and will also
  # underpin the Odia tokenizer (T-2.3a). Small, pure-Python dep.
  "indic-nlp-library>=0.92",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `real_models` accuracy tests (T-2.8) need Stanza + the 600MB Hi/Mr
# UD models downloaded. They run in the dedicated `nlp-accuracy` CI
# job — the default `pytest` invocation opts out so local dev and the
# main `nlp` CI job don't have to pay the install cost.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70 -m 'not real_models'"
markers = [
  "real_models: tests that load real Stanza / IndicNLP models; skipped by default, run via `pytest -m real_models` with `[models]` installed.",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
