name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: web (lint + typecheck + test + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @ciareader/web exec svelte-kit sync
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @ciareader/web run test:coverage
      - name: Upload web coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: ignore

  web-e2e:
    # Reader end-to-end tests (Playwright). Lives in its own job so
    # the heavyweight browser + Postgres setup doesn't slow the
    # main `web` lane and so a flake here doesn't block lint /
    # typecheck / unit signal from landing.
    name: web (playwright e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciareader
          POSTGRES_PASSWORD: ciareader
          POSTGRES_DB: ciareader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciareader -d ciareader"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ciareader:ciareader@localhost:5432/ciareader
      AUTH_SECRET: dev-only-secret-replace-in-prod-0000000000000000000000000000000
      APP_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @ciareader/web exec svelte-kit sync
      - name: Apply Drizzle migrations
        working-directory: apps/web
        run: pnpm db:migrate
      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright e2e
        working-directory: apps/web
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore

  nlp:
    name: nlp (ruff + pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -U pip && pip install -e 'services/nlp[dev]'
      - run: ruff check services/nlp
      - name: Run pytest with coverage (fail-under enforced in pyproject.toml)
        working-directory: services/nlp
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/shared-types/python
        run: pytest
      - name: Upload nlp coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlp-coverage
          path: services/nlp/.coverage
          if-no-files-found: ignore

  nlp-accuracy:
    # Real-pipeline lemma-accuracy gate (T-2.8). Installs [models],
    # downloads the Hindi + Marathi Stanza UD models, caches them, and
    # enforces >=90% Hi / >=80% Mr / >=70% Or. Lives in its own job so
    # the main `nlp` lane stays fast; this one trades latency for the
    # only real end-to-end quality signal we have before release.
    name: nlp (real-pipeline accuracy thresholds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -U pip && pip install -e 'services/nlp[dev,models]'
      - name: Cache Stanza UD models
        uses: actions/cache@v4
        with:
          path: ~/stanza_resources
          key: stanza-models-hi-mr-v1-${{ hashFiles('services/nlp/pyproject.toml') }}
      - name: Download Stanza Hi + Mr models
        run: |
          python - <<'PY'
          import stanza
          for lang in ("hi", "mr"):
              stanza.download(lang, processors="tokenize,pos,lemma", verbose=False)
          PY
      - name: Run real-pipeline accuracy thresholds
        working-directory: services/nlp
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/shared-types/python
        # Override the pyproject default (`-m 'not real_models'`) so
        # only the threshold suite runs in this job. Coverage is
        # irrelevant here — the default job enforces the floor already.
        run: pytest -m real_models --no-cov -o addopts=""

  registry-parity:
    name: language registry parity (TS vs Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify both registries declare the same language codes
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          ts = pathlib.Path("packages/shared-types/src/languages.ts").read_text(encoding="utf-8")
          py = pathlib.Path("packages/shared-types/python/languages.py").read_text(encoding="utf-8")
          ts_codes = set(re.findall(r"^\s+(hi|mr|or|pa|bn|gu|ne|ur|sd):\s", ts, re.M))
          py_codes = set(re.findall(r'^\s+"(hi|mr|or|pa|bn|gu|ne|ur|sd)":\s', py, re.M))
          if ts_codes != py_codes:
              print(f"TS codes:     {sorted(ts_codes)}", file=sys.stderr)
              print(f"Python codes: {sorted(py_codes)}", file=sys.stderr)
              sys.exit("Language registries out of sync — update both files together.")
          print(f"OK — {sorted(ts_codes)}")
          PY
