<!doctype html>
<html lang="en" data-theme="%cia.theme%" data-theme-preference="%cia.themePreference%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" sizes="any" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Parhiba, a comparative Indo-Aryan reader." />
    <!--
      Resolve the user's theme preference before first paint to avoid a
      light-mode flash for dark-mode users. The server supplies the account
      or cookie preference. System mode follows the browser color scheme.
    -->
    <script>
      (function () {
        try {
          document.documentElement.toggleAttribute(
            'data-hide-mobile-page-arrows',
            localStorage.getItem('reader.hideMobilePageArrows') === '1'
          );
        } catch (_) {}
        try {
          var root = document.documentElement;
          var scheme = window.matchMedia('(prefers-color-scheme: dark)');
          function applyTheme() {
            var pref = root.dataset.themePreference;
            root.dataset.theme = pref === 'system' ? (scheme.matches ? 'dark' : 'light') : pref;
          }
          applyTheme();
          scheme.addEventListener('change', applyTheme);
        } catch (_) {}
      })();
    </script>
    <!--
      CIAR design font stack (T-5.8). Inter / Source Serif 4 / JetBrains
      Mono are global UI fonts; the script-specific Noto + Tiro families
      back the reader body. Loaded via Google Fonts with display=swap so
      first paint never blocks on a font response.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Serif+Devanagari:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Serif+Bengali&family=Noto+Serif+Gujarati&family=Noto+Serif+Gurmukhi&family=Noto+Serif+Oriya&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
